name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          mypy src release/part4/stage8 release/part5/stage1 release/part5/stage2 release/part5/stage3 release/part5/stage4
          python scripts/validate_part4_contract.py
          python scripts/validate_part4_sources.py
          python scripts/validate_part4_admission_controls.py \
            "${RUNNER_TEMP}/part4-stage3-admission-controls.json"
          python scripts/validate_part4_stage4_controls.py \
            "${RUNNER_TEMP}/part4-stage4-evidence-readiness.json"
          python scripts/validate_part4_stage5_controls.py \
            "${RUNNER_TEMP}/part4-stage5-teardown-authority.json"
          python scripts/validate_part4_stage6_controls.py \
            "${RUNNER_TEMP}/part4-stage6-managed-execution-readiness.json"
          python scripts/validate_part4_stage7_controls.py \
            "${RUNNER_TEMP}/part4-stage7-closure-readiness.json"
          python scripts/verify_part4_stage7_runtime.py \
            "${RUNNER_TEMP}/part4-stage7-runtime.json"
          python -m release.part4.stage8.validate_controls \
            "${RUNNER_TEMP}/part4-stage8-release-readiness.json"
          python -m release.part5.stage1.validate_controls \
            "${RUNNER_TEMP}/part5-stage1-completion-contract.json"
          python -m release.part5.stage2.validate_controls \
            "${RUNNER_TEMP}/part5-stage2-traceability-controls.json"
          python -m release.part5.stage3.validate_controls \
            "${RUNNER_TEMP}/part5-stage3-operational-handoff-controls.json"
          python -m release.part5.stage4.validate_controls \
            "${RUNNER_TEMP}/part5-stage4-completion-candidate-controls.json"
          cfn-lint infra/foundation/template.yml --regions ap-southeast-2
          python -m compileall -q src tests aws release
          bash -n scripts/*.sh
      - name: Tests and coverage
        run: python -m pytest --cov-fail-under=85
      - name: Reproduce deterministic Part 4 source provenance
        run: |
          first="${RUNNER_TEMP}/part4-sources-first"
          second="${RUNNER_TEMP}/part4-sources-second"
          atlasretail generate-sources \
            --output "${first}" --orders 100 \
            --source-commit "${GITHUB_SHA}" --run-id ci
          atlasretail generate-sources \
            --output "${second}" --orders 100 \
            --source-commit "${GITHUB_SHA}" --run-id ci
          python scripts/validate_part4_sources.py --directory "${first}"
          python scripts/validate_part4_sources.py --directory "${second}"
          diff -ru "${first}" "${second}"
      - name: Reproduce local failure evidence
        run: |
          atlasretail simulate --output /tmp/failure-lab.json
          diff -u evidence/local/failure-lab.json /tmp/failure-lab.json
      - name: Reproduce deterministic Stage 3 admission-control evidence
        run: |
          python scripts/validate_part4_admission_controls.py \
            "${RUNNER_TEMP}/part4-stage3-admission-controls-second.json"
      - name: Reproduce deterministic Stage 4 evidence-readiness controls
        run: |
          python scripts/validate_part4_stage4_controls.py \
            "${RUNNER_TEMP}/part4-stage4-evidence-readiness-second.json"
          diff -u \
            "${RUNNER_TEMP}/part4-stage4-evidence-readiness.json" \
            "${RUNNER_TEMP}/part4-stage4-evidence-readiness-second.json"
          diff -u \
            "${RUNNER_TEMP}/part4-stage3-admission-controls.json" \
            "${RUNNER_TEMP}/part4-stage3-admission-controls-second.json"
      - name: Reproduce deterministic Stage 5 teardown-authority controls
        run: |
          python scripts/validate_part4_stage5_controls.py \
            "${RUNNER_TEMP}/part4-stage5-teardown-authority-second.json"
          diff -u \
            "${RUNNER_TEMP}/part4-stage5-teardown-authority.json" \
            "${RUNNER_TEMP}/part4-stage5-teardown-authority-second.json"
      - name: Reproduce deterministic Stage 6 managed-execution controls
        run: |
          python scripts/validate_part4_stage6_controls.py \
            "${RUNNER_TEMP}/part4-stage6-managed-execution-readiness-second.json"
          diff -u \
            "${RUNNER_TEMP}/part4-stage6-managed-execution-readiness.json" \
            "${RUNNER_TEMP}/part4-stage6-managed-execution-readiness-second.json"
      - name: Reproduce deterministic Stage 7 closure controls
        run: |
          python scripts/validate_part4_stage7_controls.py \
            "${RUNNER_TEMP}/part4-stage7-closure-readiness-second.json"
          python scripts/verify_part4_stage7_runtime.py \
            "${RUNNER_TEMP}/part4-stage7-runtime-second.json"
          diff -u \
            "${RUNNER_TEMP}/part4-stage7-closure-readiness.json" \
            "${RUNNER_TEMP}/part4-stage7-closure-readiness-second.json"
          diff -u \
            "${RUNNER_TEMP}/part4-stage7-runtime.json" \
            "${RUNNER_TEMP}/part4-stage7-runtime-second.json"
          if test -f evidence/part4/stage7/completion-receipt.json; then
            python scripts/publish_part4_stage7_closure.py verify \
              --receipt evidence/part4/stage7/completion-receipt.json
          fi
      - name: Reproduce deterministic Stage 8 release controls
        run: |
          python -m release.part4.stage8.validate_controls \
            "${RUNNER_TEMP}/part4-stage8-release-readiness-second.json"
          diff -u \
            "${RUNNER_TEMP}/part4-stage8-release-readiness.json" \
            "${RUNNER_TEMP}/part4-stage8-release-readiness-second.json"
          if test -f evidence/part4/stage8/release-receipt.json; then
            python -m release.part4.stage8.manage_release verify-receipt \
              --receipt evidence/part4/stage8/release-receipt.json
          fi
      - name: Reproduce deterministic Part 5 Stage 1 completion contract
        run: |
          python -m release.part5.stage1.validate_controls \
            "${RUNNER_TEMP}/part5-stage1-completion-contract-second.json"
          diff -u \
            "${RUNNER_TEMP}/part5-stage1-completion-contract.json" \
            "${RUNNER_TEMP}/part5-stage1-completion-contract-second.json"
      - name: Reproduce deterministic Part 5 Stage 2 traceability controls
        run: |
          python -m release.part5.stage2.validate_controls \
            "${RUNNER_TEMP}/part5-stage2-traceability-controls-second.json"
          diff -u \
            "${RUNNER_TEMP}/part5-stage2-traceability-controls.json" \
            "${RUNNER_TEMP}/part5-stage2-traceability-controls-second.json"
          if test -f evidence/part5/stage2/completion-gap.json; then
            python -m release.part5.stage2.evidence_traceability verify \
              --receipt evidence/part5/stage2/completion-gap.json
          fi
      - name: Reproduce deterministic Part 5 Stage 3 operational-handoff controls
        run: |
          python -m release.part5.stage3.validate_controls \
            "${RUNNER_TEMP}/part5-stage3-operational-handoff-controls-second.json"
          diff -u \
            "${RUNNER_TEMP}/part5-stage3-operational-handoff-controls.json" \
            "${RUNNER_TEMP}/part5-stage3-operational-handoff-controls-second.json"
          if test -f evidence/part5/stage3/operational-handoff.json; then
            python -m release.part5.stage3.operational_handoff verify \
              --receipt evidence/part5/stage3/operational-handoff.json
          fi
      - name: Reproduce deterministic Part 5 Stage 4 completion-candidate controls
        run: |
          python -m release.part5.stage4.validate_controls \
            "${RUNNER_TEMP}/part5-stage4-completion-candidate-controls-second.json"
          diff -u \
            "${RUNNER_TEMP}/part5-stage4-completion-candidate-controls.json" \
            "${RUNNER_TEMP}/part5-stage4-completion-candidate-controls-second.json"
          if test -f evidence/part5/stage4/completion-candidate.json; then
            python -m release.part5.stage4.completion_candidate verify \
              --receipt evidence/part5/stage4/completion-candidate.json
          fi
      - name: Upload Stage 2 source-provenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part4-stage2-source-provenance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/part4-sources-first/source-provenance-summary.json
            ${{ runner.temp }}/part4-sources-first/*/source-provenance.json
            ${{ runner.temp }}/part4-sources-first/tamper/tamper-mutation.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Stage 3 pre-AWS admission-control evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part4-stage3-admission-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/part4-stage3-admission-controls.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Stage 4 contract-complete evidence readiness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part4-stage4-evidence-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/part4-stage4-evidence-readiness.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Stage 5 immutable teardown-authority evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part4-stage5-teardown-authority-${{ github.run_id }}
          path: ${{ runner.temp }}/part4-stage5-teardown-authority.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Stage 6 managed-execution readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part4-stage6-managed-execution-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/part4-stage6-managed-execution-readiness.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Stage 7 closure readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part4-stage7-closure-readiness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/part4-stage7-closure-readiness.json
            ${{ runner.temp }}/part4-stage7-runtime.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Stage 8 release readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part4-stage8-release-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/part4-stage8-release-readiness.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Part 5 Stage 1 completion-contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part5-stage1-completion-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/part5-stage1-completion-contract.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Part 5 Stage 2 traceability-controls evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part5-stage2-traceability-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/part5-stage2-traceability-controls.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Part 5 Stage 3 operational-handoff controls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part5-stage3-operational-handoff-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/part5-stage3-operational-handoff-controls.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Part 5 Stage 4 completion-candidate controls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part5-stage4-completion-candidate-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/part5-stage4-completion-candidate-controls.json
          if-no-files-found: error
          retention-days: 30

  glue-runtime-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the exact AWS Glue 5 Spark runtime
        run: python -m pip install --disable-pip-version-check pytest==8.4.1 pyspark==3.5.4
      - name: Execute against the verified Glue 5-compatible Iceberg runtime
        run: |
          iceberg_jar="${RUNNER_TEMP}/iceberg-spark-runtime-3.5_2.12-1.7.1.jar"
          curl --fail --location --silent --show-error \
            --output "${iceberg_jar}" \
            https://repo.maven.apache.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.7.1/iceberg-spark-runtime-3.5_2.12-1.7.1.jar
          printf '%s  %s\n' \
            '7081b82d2de95bb16b5df9e7dd2fbd7e7a50931e125d5b126e947cda1dae8a6233b3694311bc38be440a2bfc5418dc56aa84f0d22d1d3f27017c36c4f1aec5d0' \
            "${iceberg_jar}" | sha512sum --check --status
          AWS_EC2_METADATA_DISABLED=true \
            PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            PYTHONDONTWRITEBYTECODE=1 \
            PYSPARK_SUBMIT_ARGS="--jars ${iceberg_jar} pyspark-shell" \
            SPARK_LOCAL_IP=127.0.0.1 \
            python -m pytest -q -o addopts= tests/integration/test_glue_spark_iceberg.py

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
      - name: Format
        run: terraform fmt -diff -check -recursive infra
      - name: Validate without an AWS backend
        run: |
          terraform -chdir=infra/atlas init -backend=false
          terraform -chdir=infra/atlas validate
