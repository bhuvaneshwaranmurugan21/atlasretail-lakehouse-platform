name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          mypy src
          cfn-lint infra/foundation/template.yml --regions ap-south-1
          python -m compileall -q src tests aws
          bash -n scripts/*.sh
      - name: Tests and coverage
        run: pytest
      - name: Reproduce local failure evidence
        run: |
          atlasretail simulate --output /tmp/failure-lab.json
          diff -u evidence/local/failure-lab.json /tmp/failure-lab.json

  glue-runtime-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Execute against the official Glue 5 Spark and Iceberg runtime
        run: |
          docker run \
            --rm \
            --network none \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --env AWS_EC2_METADATA_DISABLED=true \
            --env PYTHONPATH=/workspace/src \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env SPARK_LOCAL_IP=127.0.0.1 \
            --entrypoint /bin/bash \
            public.ecr.aws/glue/aws-glue-libs:5 \
            -c 'python3 -m pytest -q -o addopts= tests/integration/test_glue_spark_iceberg.py'

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
      - name: Format
        run: terraform fmt -diff -check -recursive infra
      - name: Validate without an AWS backend
        run: |
          terraform -chdir=infra/atlas init -backend=false
          terraform -chdir=infra/atlas validate
