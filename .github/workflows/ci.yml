name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          mypy src
          python -m compileall -q src tests aws
      - name: Tests and coverage
        run: pytest
      - name: Reproduce local failure evidence
        run: |
          atlasretail simulate --output /tmp/failure-lab.json
          diff -u evidence/local/failure-lab.json /tmp/failure-lab.json

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate without an AWS backend
        run: |
          terraform -chdir=infra/atlas init -backend=false
          terraform -chdir=infra/atlas validate
