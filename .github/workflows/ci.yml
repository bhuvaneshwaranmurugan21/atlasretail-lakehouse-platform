name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          mypy src
          python scripts/validate_part4_contract.py
          python scripts/validate_part4_sources.py
          python scripts/validate_part4_admission_controls.py \
            "${RUNNER_TEMP}/part4-stage3-admission-controls.json"
          cfn-lint infra/foundation/template.yml --regions ap-southeast-2
          python -m compileall -q src tests aws
          bash -n scripts/*.sh
      - name: Tests and coverage
        run: pytest
      - name: Reproduce deterministic Part 4 source provenance
        run: |
          first="${RUNNER_TEMP}/part4-sources-first"
          second="${RUNNER_TEMP}/part4-sources-second"
          atlasretail generate-sources \
            --output "${first}" --orders 100 \
            --source-commit "${GITHUB_SHA}" --run-id ci
          atlasretail generate-sources \
            --output "${second}" --orders 100 \
            --source-commit "${GITHUB_SHA}" --run-id ci
          python scripts/validate_part4_sources.py --directory "${first}"
          python scripts/validate_part4_sources.py --directory "${second}"
          diff -ru "${first}" "${second}"
      - name: Reproduce local failure evidence
        run: |
          atlasretail simulate --output /tmp/failure-lab.json
          diff -u evidence/local/failure-lab.json /tmp/failure-lab.json
      - name: Reproduce deterministic Stage 3 admission-control evidence
        run: |
          python scripts/validate_part4_admission_controls.py \
            "${RUNNER_TEMP}/part4-stage3-admission-controls-second.json"
          diff -u \
            "${RUNNER_TEMP}/part4-stage3-admission-controls.json" \
            "${RUNNER_TEMP}/part4-stage3-admission-controls-second.json"
      - name: Upload Stage 2 source-provenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part4-stage2-source-provenance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/part4-sources-first/source-provenance-summary.json
            ${{ runner.temp }}/part4-sources-first/*/source-provenance.json
            ${{ runner.temp }}/part4-sources-first/tamper/tamper-mutation.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Stage 3 pre-AWS admission-control evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part4-stage3-admission-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/part4-stage3-admission-controls.json
          if-no-files-found: error
          retention-days: 30

  glue-runtime-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the exact AWS Glue 5 Spark runtime
        run: python -m pip install --disable-pip-version-check pytest==8.4.1 pyspark==3.5.4
      - name: Execute against the verified Glue 5-compatible Iceberg runtime
        run: |
          iceberg_jar="${RUNNER_TEMP}/iceberg-spark-runtime-3.5_2.12-1.7.1.jar"
          curl --fail --location --silent --show-error \
            --output "${iceberg_jar}" \
            https://repo.maven.apache.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.7.1/iceberg-spark-runtime-3.5_2.12-1.7.1.jar
          printf '%s  %s\n' \
            '7081b82d2de95bb16b5df9e7dd2fbd7e7a50931e125d5b126e947cda1dae8a6233b3694311bc38be440a2bfc5418dc56aa84f0d22d1d3f27017c36c4f1aec5d0' \
            "${iceberg_jar}" | sha512sum --check --status
          AWS_EC2_METADATA_DISABLED=true \
            PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            PYTHONDONTWRITEBYTECODE=1 \
            PYSPARK_SUBMIT_ARGS="--jars ${iceberg_jar} pyspark-shell" \
            SPARK_LOCAL_IP=127.0.0.1 \
            python -m pytest -q -o addopts= tests/integration/test_glue_spark_iceberg.py

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
      - name: Format
        run: terraform fmt -diff -check -recursive infra
      - name: Validate without an AWS backend
        run: |
          terraform -chdir=infra/atlas init -backend=false
          terraform -chdir=infra/atlas validate
