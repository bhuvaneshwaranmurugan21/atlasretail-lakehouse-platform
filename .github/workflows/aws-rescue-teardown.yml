name: AWS rescue teardown

on:
  workflow_dispatch:
    inputs:
      incident_run_id:
        description: Failed bounded-lab run to remove
        required: true
        default: "31807122381"
      incident_source_commit:
        description: Full source SHA used by the failed run
        required: true
        default: "a3e757bdb141b73c9394b4d4316b5786d9a677ca"
      confirm_destroy:
        description: Type DESTROY to authorize incident cleanup
        required: true
        default: ""
  push:
    branches:
      - main
    paths:
      - .github/atlas-lab-authorizations/rescue-31807122381.json

permissions:
  id-token: write
  contents: read

concurrency:
  group: portfolio-aws-account
  cancel-in-progress: false

jobs:
  rescue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      startsWith(github.event.head_commit.message,
      'Rescue Atlas run 31807122381'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_DIR: infra/atlas
      INCIDENT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.incident_run_id || '31807122381' }}
      INCIDENT_SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.incident_source_commit || 'a3e757bdb141b73c9394b4d4316b5786d9a677ca' }}
      CONFIRM_DESTROY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_destroy || 'DESTROY' }}
      EVIDENCE_DIR: evidence/aws/rescue-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: atlasretail-rescue-${{ github.run_id }}
      - name: Validate incident and hard safety bounds
        run: |
          set -euo pipefail
          test "${CONFIRM_DESTROY}" = "DESTROY"
          test "${INCIDENT_RUN_ID}" = "31807122381"
          test "${INCIDENT_SOURCE_COMMIT}" = "a3e757bdb141b73c9394b4d4316b5786d9a677ca"
          test "${AWS_REGION}" = "ap-south-1"
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "${account}" = "887720497919"
          if [[ "${GITHUB_EVENT_NAME}" = "push" ]]; then
            python - <<'PY'
          import json
          from pathlib import Path

          authorization = json.loads(
              Path(
                  ".github/atlas-lab-authorizations/rescue-31807122381.json"
              ).read_text()
          )
          expected = {
              "schema_version": "1.0",
              "project": "AtlasRetail",
              "operation": "rescue-teardown",
              "incident_run_id": 31807122381,
              "incident_source_commit": (
                  "a3e757bdb141b73c9394b4d4316b5786d9a677ca"
              ),
              "confirm_destroy": "DESTROY",
              "scope": "EXACT_TERRAFORM_STATE_ONLY",
          }
          if authorization != expected:
              raise SystemExit("Invalid Atlas rescue authorization")
          PY
          fi
          mkdir -p "${EVIDENCE_DIR}"
          aws sts get-caller-identity > "${EVIDENCE_DIR}/caller-identity.json"
          printf '%s\n' "${INCIDENT_RUN_ID}" > "${EVIDENCE_DIR}/incident-run-id.txt"
          printf '%s\n' "${INCIDENT_SOURCE_COMMIT}" > "${EVIDENCE_DIR}/incident-source-commit.txt"
      - name: Acquire the account-wide lease
        run: bash scripts/acquire_lock.sh
      - name: Initialize the incident state only
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" init \
            -backend-config="bucket=portfolio-lab-tfstate-887720497919-ap-south-1" \
            -backend-config="key=atlasretail/main.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=portfolio-lab-terraform-locks" \
            -backend-config="encrypt=true" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-init.log"
      - name: Capture state before rescue
        run: |
          set -euo pipefail
          live_outputs="${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-live-outputs-before.json"
          terraform -chdir="${TF_DIR}" output -json \
            > "${live_outputs}" \
            2> "${EVIDENCE_DIR}/terraform-output-before.log"
          python - "${live_outputs}" "${INCIDENT_RUN_ID}" <<'PY'
          import json
          import sys
          from pathlib import Path

          outputs = json.loads(Path(sys.argv[1]).read_text())
          run_id = sys.argv[2]
          required = {
              "landing_bucket",
              "warehouse_bucket",
              "evidence_bucket",
              "control_table",
              "glue_database",
              "athena_workgroup",
              "lambda_function_name",
              "kms_key_arn",
          }
          missing = sorted(required - outputs.keys())
          if missing:
              raise SystemExit(f"Incident Terraform outputs are incomplete: {missing}")
          for name in required - {"kms_key_arn"}:
              value = outputs[name].get("value", "")
              if run_id not in value:
                  raise SystemExit(f"Terraform output {name} is outside incident scope")
          kms_arn = outputs["kms_key_arn"].get("value", "")
          expected_prefix = "arn:aws:kms:ap-south-1:887720497919:key/"
          if not kms_arn.startswith(expected_prefix):
              raise SystemExit("Terraform KMS output is outside account and region scope")
          PY
          terraform -chdir="${TF_DIR}" state list \
            > "${EVIDENCE_DIR}/terraform-state-before.txt" \
            2> "${EVIDENCE_DIR}/terraform-state-before.log"
      - name: Create, validate, and apply a saved destroy-only plan
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" plan -destroy \
            -lock-timeout=60s \
            -out=rescue.tfplan \
            -var="aws_region=${AWS_REGION}" \
            -var="run_id=${INCIDENT_RUN_ID}" \
            -var="source_commit=${INCIDENT_SOURCE_COMMIT}" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-destroy-plan.log"
          terraform -chdir="${TF_DIR}" show -json rescue.tfplan \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-destroy-plan.json"
          terraform -chdir="${TF_DIR}" show -no-color rescue.tfplan \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-destroy-plan.txt"
          python scripts/validate_terraform_plan.py \
            --mode destroy \
            --plan "${EVIDENCE_DIR}/terraform-destroy-plan.json" \
            --output "${EVIDENCE_DIR}/terraform-destroy-plan-validation.json"
          terraform -chdir="${TF_DIR}" apply -auto-approve rescue.tfplan \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-destroy-apply.log"
      - name: Prove teardown across AWS and Terraform inventories
        if: always()
        run: |
          set +e
          outputs="${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-live-outputs-before.json"
          if [[ ! -s "${outputs}" ]]; then
            printf '{}\n' > "${outputs}"
          fi
          python scripts/verify_teardown.py \
            "${outputs}" \
            "${TF_DIR}" \
            "${INCIDENT_RUN_ID}" \
            "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/teardown.json"
          verification_status="$?"
          printf '%s\n' "${verification_status}" \
            > "${EVIDENCE_DIR}/teardown-verification.status"
          exit "${verification_status}"
      - name: Release the account-wide lease
        if: always()
        run: bash scripts/release_lock.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlasretail-rescue-evidence-${{ github.run_id }}
          path: evidence/aws/rescue-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
