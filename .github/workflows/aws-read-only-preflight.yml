name: AWS read-only preflight

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: atlasretail-read-only-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_DIR: infra/atlas
      EVIDENCE_DIR: evidence/preflight/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Load and verify the checked-in AWS target
        id: target
        run: |
          python scripts/load_aws_target.py \
            --github-output "${GITHUB_OUTPUT}" \
            --github-env "${GITHUB_ENV}" \
            --expect-role-arn "${{ vars.AWS_ROLE_ARN }}" \
            --expect-region "${{ vars.AWS_REGION }}" \
            --expect-repository "${GITHUB_REPOSITORY}" \
            --expect-ref "${GITHUB_REF}" \
            --source-identity "${EVIDENCE_DIR}/source-identity.json" \
            --source-commit "${GITHUB_SHA}" \
            --github-run-id "${GITHUB_RUN_ID}"
      - name: Load the restrictive read-only session policy
        id: session-policy
        run: |
          policy="$(python scripts/build_read_only_session_policy.py)"
          printf 'json=%s\n' "${policy}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ steps.target.outputs.oidc_role_arn }}
          aws-region: ${{ steps.target.outputs.aws_region }}
          role-session-name: atlasretail-preflight-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: ${{ steps.target.outputs.aws_account_id }}
          inline-session-policy: ${{ steps.session-policy.outputs.json }}
          unset-current-credentials: true
          mask-aws-account-id: true
          action-timeout-s: 120
      - name: Prove repository identity and hard bounds
        run: |
          set -euo pipefail
          python -m json.tool infra/iam/atlasretail-github-role-policy.json > /dev/null
          test "${AWS_REGION}" = "${{ steps.target.outputs.aws_region }}"
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "${account}" = "${{ steps.target.outputs.aws_account_id }}"
          mkdir -p "${EVIDENCE_DIR}"
          aws sts get-caller-identity > "${EVIDENCE_DIR}/caller-identity.json"
          python scripts/capture_account_plan.py \
            "${EVIDENCE_DIR}/account-plan.json" "${account}"
          python scripts/verify_account_plan.py \
            "${EVIDENCE_DIR}/account-plan.json" \
            "${EVIDENCE_DIR}/account-plan-verification.json" \
            5 \
            evidence/aws/organization-shared-credit-baseline.json
      - name: Read the remote backend without deployment
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="key=${TERRAFORM_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TERRAFORM_LOCK_TABLE}" \
            -backend-config="encrypt=true" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-init.log"
          python scripts/verify_preflight.py \
            "${TF_DIR}" "${EVIDENCE_DIR}/preflight.json" \
            "${ACCOUNT_LEASE_TABLE}"
      - name: Upload identity and clean-baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-read-only-preflight-${{ github.run_id }}
          path: evidence/preflight/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
