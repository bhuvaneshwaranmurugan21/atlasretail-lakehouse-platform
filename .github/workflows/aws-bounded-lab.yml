name: AWS bounded lab

on:
  workflow_dispatch:
    inputs:
      order_count:
        description: Synthetic orders per managed scenario (100-2000)
        required: true
        default: "500"
      confirm_destroy:
        description: Type DESTROY to confirm automatic teardown
        required: true
        default: "DESTROY"
      budget_ceiling_usd:
        description: Maximum planned gross cost for this bounded run (1-10 USD)
        required: true
        default: "5"

permissions:
  id-token: write
  contents: read

concurrency:
  group: portfolio-aws-account
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      RUN_ID: ${{ github.run_id }}
      TF_DIR: infra/atlas
      EVIDENCE_DIR: evidence/aws/${{ github.run_id }}
      ORDER_COUNT: ${{ inputs.order_count }}
      CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
      BUDGET_CEILING_USD: ${{ inputs.budget_ceiling_usd }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Load and verify the checked-in AWS target
        id: target
        run: |
          python scripts/load_aws_target.py \
            --github-output "${GITHUB_OUTPUT}" \
            --github-env "${GITHUB_ENV}" \
            --expect-role-arn "${{ vars.AWS_ROLE_ARN }}" \
            --expect-region "${{ vars.AWS_REGION }}" \
            --expect-repository "${GITHUB_REPOSITORY}" \
            --expect-ref "${GITHUB_REF}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the local generator
        run: python -m pip install --disable-pip-version-check .
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ steps.target.outputs.oidc_role_arn }}
          aws-region: ${{ steps.target.outputs.aws_region }}
          role-session-name: atlasretail-${{ github.run_id }}
      - name: Validate hard safety bounds
        run: |
          set -euo pipefail
          test "${CONFIRM_DESTROY}" = "DESTROY"
          [[ "${ORDER_COUNT}" =~ ^[0-9]+$ ]]
          test "${ORDER_COUNT}" -ge 100
          test "${ORDER_COUNT}" -le 2000
          [[ "${BUDGET_CEILING_USD}" =~ ^[0-9]+$ ]]
          test "${BUDGET_CEILING_USD}" -ge 1
          test "${BUDGET_CEILING_USD}" -le "${RUN_CEILING_USD}"
          test "${AWS_REGION}" = "${{ steps.target.outputs.aws_region }}"
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "${account}" = "${{ steps.target.outputs.aws_account_id }}"
          mkdir -p "${EVIDENCE_DIR}" .control
          date +%s > "${EVIDENCE_DIR}/workflow-started-epoch.txt"
          aws sts get-caller-identity > "${EVIDENCE_DIR}/caller-identity.json"
          printf '%s' "${ORDER_COUNT}" > "${EVIDENCE_DIR}/order-count.txt"
          printf '%s' "${BUDGET_CEILING_USD}" > "${EVIDENCE_DIR}/budget-ceiling-usd.txt"
          python scripts/capture_account_plan.py \
            "${EVIDENCE_DIR}/account-plan.json" "${account}"
          python scripts/verify_account_plan.py \
            "${EVIDENCE_DIR}/account-plan.json" \
            "${EVIDENCE_DIR}/account-plan-verification.json" \
            "${BUDGET_CEILING_USD}" \
            evidence/aws/organization-shared-credit-baseline.json
          aws budgets describe-budget \
            --account-id "${account}" \
            --budget-name "${BUDGET_NAME}" \
            > "${EVIDENCE_DIR}/account-budget.json"
      - name: Acquire the account-wide lease
        run: |
          bash scripts/acquire_lock.sh
          printf '%s' "${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}" > .control/lease-owner.txt
      - name: Persist lease ownership
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-lease-${{ github.run_id }}
          path: .control/lease-owner.txt
          if-no-files-found: error
          retention-days: 1
      - name: Initialize backend and prove a clean preflight
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="key=${TERRAFORM_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TERRAFORM_LOCK_TABLE}" \
            -backend-config="encrypt=true" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-init.log"
          python scripts/verify_preflight.py \
            "${TF_DIR}" "${EVIDENCE_DIR}/preflight.json" \
            "${ACCOUNT_LEASE_TABLE}" \
            "${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}"
          printf '%s' "${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}" \
            > .control/teardown-authorized.txt
      - name: Persist teardown authority before deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-teardown-authority-${{ github.run_id }}
          path: .control/teardown-authorized.txt
          if-no-files-found: error
          retention-days: 1
      - name: Create and validate the saved apply plan
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" plan \
            -lock-timeout=60s \
            -out=apply.tfplan \
            -var="aws_region=${AWS_REGION}" \
            -var="run_id=${RUN_ID}" \
            -var="source_commit=${GITHUB_SHA}" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-plan.log"
          terraform -chdir="${TF_DIR}" show -json apply.tfplan \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-apply-plan.json"
          terraform -chdir="${TF_DIR}" show -no-color apply.tfplan \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-apply-plan.txt"
          python scripts/validate_terraform_plan.py \
            --mode apply \
            --plan "${EVIDENCE_DIR}/terraform-apply-plan.json" \
            --output "${EVIDENCE_DIR}/terraform-apply-plan-validation.json"
          python scripts/extract_state_machine_definition.py \
            "${EVIDENCE_DIR}/terraform-apply-plan.json" \
            "${EVIDENCE_DIR}/state-machine-definition.json"
          aws stepfunctions validate-state-machine-definition \
            --definition "file://${EVIDENCE_DIR}/state-machine-definition.json" \
            --type STANDARD \
            --severity WARNING \
            > "${EVIDENCE_DIR}/state-machine-validation.json"
          python - "${EVIDENCE_DIR}/state-machine-validation.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          if result.get("result") != "OK":
              raise SystemExit(f"Step Functions validation failed: {result}")
          PY
      - name: Apply only the validated saved plan
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" apply -auto-approve apply.tfplan \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-apply.log"
          terraform -chdir="${TF_DIR}" output -json \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-outputs.json"
      - name: Generate and upload immutable inputs
        run: |
          set -euo pipefail
          landing="$(terraform -chdir="${TF_DIR}" output -raw landing_bucket)"
          kms_key="$(terraform -chdir="${TF_DIR}" output -raw kms_key_arn)"
          for specification in \
            "success:21:none" \
            "failure:84:none" \
            "tamper:77:none" \
            "temporal:42:temporal-overlap" \
            "financial:63:financial"; do
            IFS=: read -r scenario seed fault <<< "${specification}"
            batch="${scenario}-${RUN_ID}"
            python -m atlasretail.cli generate \
              --output ".artifacts/aws/${batch}" \
              --orders "${ORDER_COUNT}" \
              --seed "${seed}" \
              --batch-id "${batch}" \
              --fault "${fault}"
            python scripts/upload_immutable_batch.py \
              --directory ".artifacts/aws/${batch}" \
              --bucket "${landing}" \
              --prefix "runs/${batch}" \
              --kms-key "${kms_key}" \
              --output "${EVIDENCE_DIR}/${scenario}-registration.json"
            cp ".artifacts/aws/${batch}/managed-manifest.json" \
              "${EVIDENCE_DIR}/${scenario}-managed-manifest.json"
            cp ".artifacts/aws/${batch}/expected-results.json" \
              "${EVIDENCE_DIR}/${scenario}-expected-results.json"
          done
      - name: Execute success and replay proofs
        run: |
          set -euo pipefail
          machine="$(terraform -chdir="${TF_DIR}" output -raw state_machine_arn)"
          batch="success-${RUN_ID}"
          registration="${EVIDENCE_DIR}/success-registration.json"
          readarray -t identity < <(python - "${registration}" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          print(value["manifest_uri"])
          print(value["manifest_version_id"])
          print(value["identity_digest"])
          PY
          )
          read -r success_arn success_status < <(bash scripts/start_execution.sh \
            "success-${RUN_ID}" "${machine}" "${identity[0]}" \
            "${identity[1]}" "${batch}" "${identity[2]}" false)
          printf '%s' "${success_arn}" > "${EVIDENCE_DIR}/success-execution-arn.txt"
          test "${success_status}" = "SUCCEEDED"
          read -r replay_arn replay_status < <(bash scripts/start_execution.sh \
            "replay-${RUN_ID}" "${machine}" "${identity[0]}" \
            "${identity[1]}" "${batch}" "${identity[2]}" false)
          printf '%s' "${replay_arn}" > "${EVIDENCE_DIR}/replay-execution-arn.txt"
          test "${replay_status}" = "SUCCEEDED"
          read -r conflict_arn conflict_status < <(bash scripts/start_execution.sh \
            "conflict-${RUN_ID}" "${machine}" "${identity[0]}" \
            "${identity[1]}" "${batch}" "$(printf 'f%.0s' {1..64})" false)
          printf '%s' "${conflict_arn}" > "${EVIDENCE_DIR}/conflict-execution-arn.txt"
          test "${conflict_status}" = "FAILED"
      - name: Prove failure isolation and deterministic recovery
        run: |
          set -euo pipefail
          machine="$(terraform -chdir="${TF_DIR}" output -raw state_machine_arn)"
          table="$(terraform -chdir="${TF_DIR}" output -raw control_table)"
          batch="failure-${RUN_ID}"
          registration="${EVIDENCE_DIR}/failure-registration.json"
          readarray -t identity < <(python - "${registration}" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          print(value["manifest_uri"])
          print(value["manifest_version_id"])
          print(value["identity_digest"])
          PY
          )
          aws dynamodb get-item --table-name "${table}" \
            --key '{"pk":{"S":"CONTROL"},"sk":{"S":"ACTIVE"}}' \
            --consistent-read > "${EVIDENCE_DIR}/pointer-before-failure.json"
          read -r failure_arn failure_status < <(bash scripts/start_execution.sh \
            "failure-${RUN_ID}" "${machine}" "${identity[0]}" \
            "${identity[1]}" "${batch}" "${identity[2]}" true)
          printf '%s' "${failure_arn}" > "${EVIDENCE_DIR}/failure-execution-arn.txt"
          test "${failure_status}" = "FAILED"
          aws dynamodb get-item --table-name "${table}" \
            --key '{"pk":{"S":"CONTROL"},"sk":{"S":"ACTIVE"}}' \
            --consistent-read > "${EVIDENCE_DIR}/pointer-after-failure.json"
          diff -u "${EVIDENCE_DIR}/pointer-before-failure.json" \
            "${EVIDENCE_DIR}/pointer-after-failure.json"
          read -r recovery_arn recovery_status < <(bash scripts/start_execution.sh \
            "recovery-${RUN_ID}" "${machine}" "${identity[0]}" \
            "${identity[1]}" "${batch}" "${identity[2]}" false)
          printf '%s' "${recovery_arn}" > "${EVIDENCE_DIR}/recovery-execution-arn.txt"
          test "${recovery_status}" = "SUCCEEDED"
      - name: Reject temporal overlap and financial imbalance
        run: |
          set -euo pipefail
          machine="$(terraform -chdir="${TF_DIR}" output -raw state_machine_arn)"
          for scenario in temporal financial; do
            batch="${scenario}-${RUN_ID}"
            registration="${EVIDENCE_DIR}/${scenario}-registration.json"
            readarray -t identity < <(python - "${registration}" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          print(value["manifest_uri"])
          print(value["manifest_version_id"])
          print(value["identity_digest"])
          PY
            )
            read -r execution_arn execution_status < <(bash scripts/start_execution.sh \
              "${scenario}-${RUN_ID}" "${machine}" "${identity[0]}" \
              "${identity[1]}" "${batch}" "${identity[2]}" false)
            printf '%s' "${execution_arn}" \
              > "${EVIDENCE_DIR}/${scenario}-execution-arn.txt"
            test "${execution_status}" = "FAILED"
          done
      - name: Reject an S3 version whose bytes contradict registered evidence
        run: |
          set -euo pipefail
          landing="$(terraform -chdir="${TF_DIR}" output -raw landing_bucket)"
          kms_key="$(terraform -chdir="${TF_DIR}" output -raw kms_key_arn)"
          machine="$(terraform -chdir="${TF_DIR}" output -raw state_machine_arn)"
          batch="tamper-${RUN_ID}"
          registration="${EVIDENCE_DIR}/tamper-registration.json"
          object_key="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["tables"]["orders"][0]["key"])' "${registration}")"
          python -c 'from pathlib import Path; Path(".artifacts/tampered-bytes").write_bytes(b"deliberately-corrupted-object")'
          aws s3api put-object \
            --bucket "${landing}" \
            --key "${object_key}" \
            --body .artifacts/tampered-bytes \
            --server-side-encryption aws:kms \
            --ssekms-key-id "${kms_key}" \
            --checksum-algorithm SHA256 \
            > "${EVIDENCE_DIR}/tampered-object-put.json"
          tampered_version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["VersionId"])' "${EVIDENCE_DIR}/tampered-object-put.json")"
          python scripts/create_tampered_manifest.py \
            --input ".artifacts/aws/${batch}/managed-manifest.json" \
            --table orders \
            --version-id "${tampered_version}" \
            --output ".artifacts/aws/${batch}/tampered-manifest.json"
          aws s3api put-object \
            --bucket "${landing}" \
            --key "runs/${batch}/tampered-manifest.json" \
            --body ".artifacts/aws/${batch}/tampered-manifest.json" \
            --server-side-encryption aws:kms \
            --ssekms-key-id "${kms_key}" \
            --checksum-algorithm SHA256 \
            > "${EVIDENCE_DIR}/tampered-manifest-put.json"
          python - \
            ".artifacts/aws/${batch}/tampered-manifest.json" \
            "${EVIDENCE_DIR}/tampered-manifest-put.json" \
            "s3://${landing}/runs/${batch}/tampered-manifest.json" \
            "${EVIDENCE_DIR}/tamper-execution-registration.json" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text())
          uploaded = json.loads(Path(sys.argv[2]).read_text())
          result = {
              "manifest_uri": sys.argv[3],
              "manifest_version_id": uploaded["VersionId"],
              "identity_digest": manifest["identity_digest"],
          }
          Path(sys.argv[4]).write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY
          readarray -t identity < <(python - "${EVIDENCE_DIR}/tamper-execution-registration.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          print(value["manifest_uri"])
          print(value["manifest_version_id"])
          print(value["identity_digest"])
          PY
          )
          read -r tamper_arn tamper_status < <(bash scripts/start_execution.sh \
            "tamper-${RUN_ID}" "${machine}" "${identity[0]}" \
            "${identity[1]}" "${batch}" "${identity[2]}" false)
          printf '%s' "${tamper_arn}" > "${EVIDENCE_DIR}/tamper-execution-arn.txt"
          test "${tamper_status}" = "FAILED"
      - name: Prove stale publisher compare-and-swap rejection
        run: |
          set -euo pipefail
          function="$(terraform -chdir="${TF_DIR}" output -raw lambda_function_name)"
          evidence_bucket="$(terraform -chdir="${TF_DIR}" output -raw evidence_bucket)"
          kms_key="$(terraform -chdir="${TF_DIR}" output -raw kms_key_arn)"
          python scripts/prove_stale_publisher.py \
            --function "${function}" \
            --evidence-bucket "${evidence_bucket}" \
            --kms-key "${kms_key}" \
            --source-registration "${EVIDENCE_DIR}/success-registration.json" \
            --run-id "${RUN_ID}" \
            --output-directory "${EVIDENCE_DIR}/stale-publisher"
      - name: Run and validate bounded Athena verification
        run: |
          set -euo pipefail
          workgroup="$(terraform -chdir="${TF_DIR}" output -raw athena_workgroup)"
          database="$(terraform -chdir="${TF_DIR}" output -raw glue_database)"
          function="$(terraform -chdir="${TF_DIR}" output -raw lambda_function_name)"
          aws lambda invoke \
            --function-name "${function}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"resolve"}' \
            "${EVIDENCE_DIR}/serving-resolution.json" >/dev/null
          generation="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation_id"])' "${EVIDENCE_DIR}/serving-resolution.json")"
          bash scripts/wait_athena.sh "${workgroup}" "${database}" \
            "SELECT count(*) AS orders, sum(total_cents) AS gross_cents FROM orders WHERE generation_id='${generation}'" \
            "${EVIDENCE_DIR}/athena-orders.json"
          python scripts/validate_athena_results.py \
            "${EVIDENCE_DIR}/failure-expected-results.json" \
            "${EVIDENCE_DIR}/athena-orders-results.json" \
            "${EVIDENCE_DIR}/athena-validation.json"
          serving_sql="$(atlasretail serving-query \
            --resolution "${EVIDENCE_DIR}/serving-resolution.json" \
            --database "${database}")"
          bash scripts/wait_athena.sh "${workgroup}" "${database}" \
            "${serving_sql}" \
            "${EVIDENCE_DIR}/athena-six-table-serving.json"
      - name: Collect AWS execution and CloudWatch evidence
        if: always()
        run: |
          set +e
          date +%s > "${EVIDENCE_DIR}/workflow-evidence-collected-epoch.txt"
          machine="$(terraform -chdir="${TF_DIR}" output -raw state_machine_arn 2>/dev/null)"
          job="$(terraform -chdir="${TF_DIR}" output -raw glue_job_name 2>/dev/null)"
          table="$(terraform -chdir="${TF_DIR}" output -raw control_table 2>/dev/null)"
          alarm="$(terraform -chdir="${TF_DIR}" output -raw pipeline_alarm_name 2>/dev/null)"
          glue_logs="$(terraform -chdir="${TF_DIR}" output -raw glue_log_group_name 2>/dev/null)"
          states_logs="$(terraform -chdir="${TF_DIR}" output -raw states_log_group_name 2>/dev/null)"
          lambda_logs="$(terraform -chdir="${TF_DIR}" output -raw lambda_log_group_name 2>/dev/null)"
          if [[ "${machine}" == arn:aws:states:"${AWS_REGION}":"${AWS_ACCOUNT_ID}":stateMachine:atlasretail-* ]]; then
            aws stepfunctions list-executions --state-machine-arn "${machine}" \
              > "${EVIDENCE_DIR}/stepfunctions-executions.json"
          else
            printf '{"executions":[],"collection":"SKIPPED_NO_DEPLOYMENT"}\n' \
              > "${EVIDENCE_DIR}/stepfunctions-executions.json"
          fi
          python scripts/backfill_execution_arns.py \
            "${EVIDENCE_DIR}/stepfunctions-executions.json" \
            "${EVIDENCE_DIR}" "${RUN_ID}"
          for kind in success replay conflict failure recovery tamper temporal financial; do
            arn_file="${EVIDENCE_DIR}/${kind}-execution-arn.txt"
            if [[ -s "${arn_file}" ]]; then
              aws stepfunctions get-execution-history \
                --execution-arn "$(<"${arn_file}")" \
                --include-execution-data \
                > "${EVIDENCE_DIR}/${kind}-history.json"
            fi
          done
          if [[ "${job}" == atlasretail-${RUN_ID}-* ]]; then
            aws glue get-job-runs --job-name "${job}" > "${EVIDENCE_DIR}/glue-job-runs.json"
          else
            printf '{"JobRuns":[],"collection":"SKIPPED_NO_DEPLOYMENT"}\n' \
              > "${EVIDENCE_DIR}/glue-job-runs.json"
          fi
          if [[ "${table}" == atlasretail-${RUN_ID}-control ]]; then
            aws dynamodb scan --table-name "${table}" --consistent-read \
              > "${EVIDENCE_DIR}/control-table.json"
          else
            printf '{"Items":[],"collection":"SKIPPED_NO_DEPLOYMENT"}\n' \
              > "${EVIDENCE_DIR}/control-table.json"
          fi
          if [[ "${alarm}" == atlasretail-${RUN_ID}-pipeline-failed ]]; then
            aws cloudwatch describe-alarms --alarm-names "${alarm}" \
              > "${EVIDENCE_DIR}/alarms.json"
          else
            printf '{"MetricAlarms":[],"collection":"SKIPPED_NO_DEPLOYMENT"}\n' \
              > "${EVIDENCE_DIR}/alarms.json"
          fi
          for name in glue states lambda; do
            case "${name}" in
              glue) group="${glue_logs}" ;;
              states) group="${states_logs}" ;;
              lambda) group="${lambda_logs}" ;;
            esac
            if [[ "${group}" == *atlasretail-${RUN_ID}* ]]; then
              for attempt in $(seq 1 6); do
                aws logs filter-log-events --log-group-name "${group}" \
                  > "${EVIDENCE_DIR}/${name}-cloudwatch-events.json"
                if jq -e '.events | type == "array" and length > 0' \
                  "${EVIDENCE_DIR}/${name}-cloudwatch-events.json" > /dev/null; then
                  break
                fi
                if [[ "${attempt}" -lt 6 ]]; then
                  sleep 10
                fi
              done
            else
              printf '{"events":[],"collection":"SKIPPED_NO_DEPLOYMENT"}\n' \
                > "${EVIDENCE_DIR}/${name}-cloudwatch-events.json"
            fi
          done
          python scripts/summarize_aws_evidence.py "${EVIDENCE_DIR}" "${GITHUB_SHA}"
      - name: Persist evidence before teardown
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-pre-teardown-${{ github.run_id }}
          path: evidence/aws/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1

  teardown:
    needs: execute
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      RUN_ID: ${{ github.run_id }}
      TF_DIR: infra/atlas
      EVIDENCE_DIR: evidence/aws/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Load and verify the checked-in AWS target
        id: target
        run: |
          python scripts/load_aws_target.py \
            --github-output "${GITHUB_OUTPUT}" \
            --github-env "${GITHUB_ENV}" \
            --expect-role-arn "${{ vars.AWS_ROLE_ARN }}" \
            --expect-region "${{ vars.AWS_REGION }}" \
            --expect-repository "${GITHUB_REPOSITORY}" \
            --expect-ref "${GITHUB_REF}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ steps.target.outputs.oidc_role_arn }}
          aws-region: ${{ steps.target.outputs.aws_region }}
          role-session-name: atlasretail-teardown-${{ github.run_id }}
      - name: Prepare teardown workspace
        run: mkdir -p "${EVIDENCE_DIR}" .control/teardown
      - name: Recover pre-teardown evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlasretail-pre-teardown-${{ github.run_id }}
          path: evidence/aws/${{ github.run_id }}
      - name: Recover immutable teardown authority
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlasretail-teardown-authority-${{ github.run_id }}
          path: .control/teardown
      - name: Validate teardown authority
        id: authority
        run: |
          expected="${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}"
          authority=".control/teardown/teardown-authorized.txt"
          if [[ -s "${authority}" ]] && [[ "$(<"${authority}")" = "${expected}" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            printf '{"result":"SKIPPED","reason":"No valid teardown authority was persisted before apply."}\n' \
              > "${EVIDENCE_DIR}/teardown.json"
          fi
      - name: Initialize backend and capture final outputs
        if: steps.authority.outputs.present == 'true'
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="key=${TERRAFORM_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TERRAFORM_LOCK_TABLE}" \
            -backend-config="encrypt=true" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-teardown-init.log"
          outputs="${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-outputs.json"
          if [[ ! -s "${outputs}" ]]; then
            terraform -chdir="${TF_DIR}" output -json > "${outputs}" \
              2> "${EVIDENCE_DIR}/terraform-output-recovery.log" \
              || printf '{}\n' > "${outputs}"
          fi
      - name: Create and validate the saved destroy-only plan
        if: steps.authority.outputs.present == 'true'
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" plan -destroy \
            -lock-timeout=60s \
            -out=destroy.tfplan \
            -var="aws_region=${AWS_REGION}" \
            -var="run_id=${RUN_ID}" \
            -var="source_commit=${GITHUB_SHA}" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-destroy-plan.log"
          terraform -chdir="${TF_DIR}" show -json destroy.tfplan \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-destroy-plan.json"
          terraform -chdir="${TF_DIR}" show -no-color destroy.tfplan \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-destroy-plan.txt"
          python scripts/validate_terraform_plan.py \
            --mode destroy \
            --plan "${EVIDENCE_DIR}/terraform-destroy-plan.json" \
            --output "${EVIDENCE_DIR}/terraform-destroy-plan-validation.json"
      - name: Apply only the validated saved destroy plan
        if: steps.authority.outputs.present == 'true'
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" apply -auto-approve destroy.tfplan \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-destroy.log"
      - name: Prove teardown across AWS and Terraform inventories
        if: ${{ always() && steps.authority.outputs.present == 'true' }}
        run: |
          python scripts/verify_teardown.py \
            "${EVIDENCE_DIR}/terraform-outputs.json" \
            "${TF_DIR}" \
            "${RUN_ID}" \
            "${EVIDENCE_DIR}/teardown.json"
      - name: Release only this run's account-wide lease
        if: always()
        env:
          PORTFOLIO_LOCK_OWNER: ${{ github.repository }}/${{ github.run_id }}
        run: bash scripts/release_lock.sh
      - name: Upload final execution and teardown evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-aws-evidence-${{ github.run_id }}
          path: evidence/aws/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
