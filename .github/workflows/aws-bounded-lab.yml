name: AWS bounded lab

on:
  workflow_dispatch:
    inputs:
      order_count:
        description: Synthetic orders per scenario (100-10000)
        required: true
        default: "1000"
      confirm_destroy:
        description: Type DESTROY to confirm automatic teardown
        required: true
        default: "DESTROY"

permissions:
  id-token: write
  contents: read

concurrency:
  group: portfolio-aws-account
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.AWS_REGION }}
      RUN_ID: ${{ github.run_id }}
      TF_DIR: infra/atlas
      EVIDENCE_DIR: evidence/aws/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the local generator
        run: python -m pip install --disable-pip-version-check .
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: atlasretail-${{ github.run_id }}
      - name: Validate hard safety bounds
        env:
          ORDER_COUNT: ${{ inputs.order_count }}
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          set -euo pipefail
          test "${CONFIRM_DESTROY}" = "DESTROY"
          [[ "${ORDER_COUNT}" =~ ^[0-9]+$ ]]
          test "${ORDER_COUNT}" -ge 100
          test "${ORDER_COUNT}" -le 10000
          test "${AWS_REGION}" = "ap-south-1"
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "${account}" = "887720497919"
          mkdir -p "${EVIDENCE_DIR}"
          aws sts get-caller-identity > "${EVIDENCE_DIR}/caller-identity.json"
          printf '%s' "${ORDER_COUNT}" > "${EVIDENCE_DIR}/order-count.txt"
      - name: Acquire the account-wide lease
        run: bash scripts/acquire_lock.sh
      - name: Initialize and apply Terraform
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" init \
            -backend-config="bucket=portfolio-lab-tfstate-887720497919-ap-south-1" \
            -backend-config="key=atlasretail/main.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=portfolio-lab-terraform-locks" \
            -backend-config="encrypt=true"
          terraform -chdir="${TF_DIR}" apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="run_id=${RUN_ID}" \
            -var="source_commit=${GITHUB_SHA}"
          terraform -chdir="${TF_DIR}" output -json > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-outputs.json"
      - name: Generate and upload immutable inputs
        env:
          ORDER_COUNT: ${{ inputs.order_count }}
        run: |
          set -euo pipefail
          landing="$(terraform -chdir="${TF_DIR}" output -raw landing_bucket)"
          kms_key="$(terraform -chdir="${TF_DIR}" output -raw kms_key_arn)"
          for scenario in success failure; do
            batch="${scenario}-${RUN_ID}"
            python -m atlasretail.cli generate \
              --output ".artifacts/aws/${batch}" \
              --orders "${ORDER_COUNT}" \
              --seed "$([[ "${scenario}" = success ]] && echo 21 || echo 84)" \
              --batch-id "${batch}"
            aws s3 cp ".artifacts/aws/${batch}" "s3://${landing}/runs/${batch}" \
              --recursive \
              --only-show-errors \
              --sse aws:kms \
              --sse-kms-key-id "${kms_key}"
          done
      - name: Execute success and replay proofs
        run: |
          set -euo pipefail
          landing="$(terraform -chdir="${TF_DIR}" output -raw landing_bucket)"
          machine="$(terraform -chdir="${TF_DIR}" output -raw state_machine_arn)"
          batch="success-${RUN_ID}"
          digest="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["identity_digest"])' ".artifacts/aws/${batch}/manifest.json")"
          read -r success_arn success_status < <(bash scripts/start_execution.sh \
            "success-${RUN_ID}" "${machine}" "s3://${landing}/runs/${batch}" \
            "s3://${landing}/runs/${batch}/manifest.json" "${batch}" "${digest}" false)
          test "${success_status}" = "SUCCEEDED"
          read -r replay_arn replay_status < <(bash scripts/start_execution.sh \
            "replay-${RUN_ID}" "${machine}" "s3://${landing}/runs/${batch}" \
            "s3://${landing}/runs/${batch}/manifest.json" "${batch}" "${digest}" false)
          test "${replay_status}" = "SUCCEEDED"
          printf '%s' "${success_arn}" > "${EVIDENCE_DIR}/success-execution-arn.txt"
          printf '%s' "${replay_arn}" > "${EVIDENCE_DIR}/replay-execution-arn.txt"
      - name: Prove failure isolation and deterministic recovery
        run: |
          set -euo pipefail
          landing="$(terraform -chdir="${TF_DIR}" output -raw landing_bucket)"
          machine="$(terraform -chdir="${TF_DIR}" output -raw state_machine_arn)"
          table="$(terraform -chdir="${TF_DIR}" output -raw control_table)"
          batch="failure-${RUN_ID}"
          digest="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["identity_digest"])' ".artifacts/aws/${batch}/manifest.json")"
          aws dynamodb get-item --table-name "${table}" \
            --key '{"pk":{"S":"CONTROL"},"sk":{"S":"ACTIVE"}}' \
            --consistent-read > "${EVIDENCE_DIR}/pointer-before-failure.json"
          read -r failure_arn failure_status < <(bash scripts/start_execution.sh \
            "failure-${RUN_ID}" "${machine}" "s3://${landing}/runs/${batch}" \
            "s3://${landing}/runs/${batch}/manifest.json" "${batch}" "${digest}" true)
          test "${failure_status}" = "FAILED"
          aws dynamodb get-item --table-name "${table}" \
            --key '{"pk":{"S":"CONTROL"},"sk":{"S":"ACTIVE"}}' \
            --consistent-read > "${EVIDENCE_DIR}/pointer-after-failure.json"
          diff -u "${EVIDENCE_DIR}/pointer-before-failure.json" "${EVIDENCE_DIR}/pointer-after-failure.json"
          read -r recovery_arn recovery_status < <(bash scripts/start_execution.sh \
            "recovery-${RUN_ID}" "${machine}" "s3://${landing}/runs/${batch}" \
            "s3://${landing}/runs/${batch}/manifest.json" "${batch}" "${digest}" false)
          test "${recovery_status}" = "SUCCEEDED"
          printf '%s' "${failure_arn}" > "${EVIDENCE_DIR}/failure-execution-arn.txt"
          printf '%s' "${recovery_arn}" > "${EVIDENCE_DIR}/recovery-execution-arn.txt"
      - name: Run bounded Athena verification
        run: |
          set -euo pipefail
          workgroup="$(terraform -chdir="${TF_DIR}" output -raw athena_workgroup)"
          database="$(terraform -chdir="${TF_DIR}" output -raw glue_database)"
          generation="g-failure-${RUN_ID}"
          bash scripts/wait_athena.sh "${workgroup}" "${database}" \
            "SELECT count(*) AS orders, sum(total_cents) AS gross_cents FROM orders WHERE generation_id='${generation}'" \
            "${EVIDENCE_DIR}/athena-orders.json"
      - name: Collect AWS execution evidence
        if: always()
        run: |
          set +e
          machine="$(terraform -chdir="${TF_DIR}" output -raw state_machine_arn 2>/dev/null)"
          job="$(terraform -chdir="${TF_DIR}" output -raw glue_job_name 2>/dev/null)"
          table="$(terraform -chdir="${TF_DIR}" output -raw control_table 2>/dev/null)"
          aws stepfunctions list-executions --state-machine-arn "${machine}" \
            > "${EVIDENCE_DIR}/stepfunctions-executions.json"
          for kind in success replay failure recovery; do
            arn_file="${EVIDENCE_DIR}/${kind}-execution-arn.txt"
            if [[ -s "${arn_file}" ]]; then
              aws stepfunctions get-execution-history \
                --execution-arn "$(<"${arn_file}")" \
                --include-execution-data \
                > "${EVIDENCE_DIR}/${kind}-history.json"
            fi
          done
          aws glue get-job-runs --job-name "${job}" > "${EVIDENCE_DIR}/glue-job-runs.json"
          aws dynamodb scan --table-name "${table}" --consistent-read > "${EVIDENCE_DIR}/control-table.json"
          aws cloudwatch describe-alarms --alarm-name-prefix "atlasretail-${RUN_ID}" \
            > "${EVIDENCE_DIR}/alarms.json"
          python scripts/summarize_aws_evidence.py "${EVIDENCE_DIR}" "${GITHUB_SHA}"
      - name: Destroy all ephemeral infrastructure
        if: always()
        run: |
          set +e
          outputs="${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-outputs.json"
          terraform -chdir="${TF_DIR}" destroy -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="run_id=${RUN_ID}" \
            -var="source_commit=${GITHUB_SHA}"
          destroy_status="$?"
          python scripts/verify_teardown.py "${outputs}" "${TF_DIR}" \
            "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/teardown.json"
          verification_status="$?"
          if [[ "${destroy_status}" -ne 0 || "${verification_status}" -ne 0 ]]; then
            exit 1
          fi
      - name: Release the account-wide lease
        if: always()
        run: bash scripts/release_lock.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlasretail-aws-evidence-${{ github.run_id }}
          path: evidence/aws/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
