name: AWS controlled deployment canary

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY_ATLASRETAIL_CANARY
        required: true
      confirm_destroy:
        description: Type DESTROY_AFTER_VERIFICATION
        required: true
      budget_ceiling_usd:
        description: Maximum permitted budget headroom consumed by this run (1-5 USD)
        required: true
        default: "5"
      preflight_run_id:
        description: Successful current-source AWS read-only preflight run ID
        required: true
      glue_probe_run_id:
        description: Successful current-source Glue capability probe run ID
        required: true
      plan_run_id:
        description: Successful current-source exact plan-only proof run ID
        required: true

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: portfolio-aws-account
  cancel-in-progress: false

jobs:
  admission:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ADMISSION_DIR: .control/admission/${{ github.run_id }}
      EVIDENCE_DIR: evidence/deployment/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Enforce deployment source and operator bounds
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          [[ "${{ inputs.preflight_run_id }}" =~ ^[1-9][0-9]*$ ]]
          [[ "${{ inputs.glue_probe_run_id }}" =~ ^[1-9][0-9]*$ ]]
          [[ "${{ inputs.plan_run_id }}" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "${ADMISSION_DIR}" "${EVIDENCE_DIR}"
      - name: Download the exact preflight prerequisite
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlasretail-read-only-preflight-${{ inputs.preflight_run_id }}
          path: .control/admission/${{ github.run_id }}/preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
      - name: Download the exact Glue capability prerequisite
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlasretail-glue-service-probe-${{ inputs.glue_probe_run_id }}
          path: .control/admission/${{ github.run_id }}/glue-probe
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.glue_probe_run_id }}
      - name: Download the exact plan-only prerequisite
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlasretail-plan-only-${{ inputs.plan_run_id }}
          path: .control/admission/${{ github.run_id }}/plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}
      - name: Fail closed over current-source prerequisite evidence
        run: |
          python scripts/validate_phase5_admission.py \
            --preflight-dir "${ADMISSION_DIR}/preflight" \
            --glue-probe-dir "${ADMISSION_DIR}/glue-probe" \
            --plan-dir "${ADMISSION_DIR}/plan" \
            --preflight-run-id "${{ inputs.preflight_run_id }}" \
            --glue-probe-run-id "${{ inputs.glue_probe_run_id }}" \
            --plan-run-id "${{ inputs.plan_run_id }}" \
            --source-commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}" \
            --output "${EVIDENCE_DIR}/admission-verification.json"
      - name: Persist admitted prerequisite proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-deployment-admission-${{ github.run_id }}
          path: evidence/deployment/${{ github.run_id }}/admission-verification.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      RUN_ID: ${{ github.run_id }}
      TF_DIR: infra/atlas
      EVIDENCE_DIR: evidence/deployment/${{ github.run_id }}
      CONTROL_DIR: .control/deployment/${{ github.run_id }}
      CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
      CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
      BUDGET_CEILING_USD: ${{ inputs.budget_ceiling_usd }}
      POLICY_NAME: AtlasRetailBoundedLabPolicy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Load and verify the checked-in AWS target
        id: target
        run: |
          python scripts/load_aws_target.py \
            --github-output "${GITHUB_OUTPUT}" \
            --github-env "${GITHUB_ENV}" \
            --expect-role-arn "${{ vars.AWS_ROLE_ARN }}" \
            --expect-region "${{ vars.AWS_REGION }}" \
            --expect-repository "${GITHUB_REPOSITORY}" \
            --expect-ref "${GITHUB_REF}" \
            --source-identity "${EVIDENCE_DIR}/deploy-source-identity.json" \
            --source-commit "${GITHUB_SHA}" \
            --github-run-id "${GITHUB_RUN_ID}"
      - name: Render the deployment session boundary
        id: session-policy
        run: |
          policy="$(python scripts/build_phase5_session_policy.py \
            --mode deploy --output "${EVIDENCE_DIR}/deploy-session-policy.json")"
          printf 'json=%s\n' "${policy}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - name: Recover the admitted prerequisite proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlasretail-deployment-admission-${{ github.run_id }}
          path: evidence/deployment/${{ github.run_id }}
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        id: aws-credentials
        with:
          role-to-assume: ${{ steps.target.outputs.oidc_role_arn }}
          aws-region: ${{ steps.target.outputs.aws_region }}
          role-session-name: atlasretail-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ steps.target.outputs.aws_account_id }}
          inline-session-policy: ${{ steps.session-policy.outputs.json }}
          unset-current-credentials: true
          mask-aws-account-id: true
          action-timeout-s: 120

      - name: Validate immutable admission bounds
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_ACTOR}" = "bhuvaneshwaranmurugan21"
          test "${CONFIRM_DEPLOY}" = "DEPLOY_ATLASRETAIL_CANARY"
          test "${CONFIRM_DESTROY}" = "DESTROY_AFTER_VERIFICATION"
          [[ "${BUDGET_CEILING_USD}" =~ ^[0-9]+$ ]]
          test "${BUDGET_CEILING_USD}" -ge 1
          test "${BUDGET_CEILING_USD}" -le "${RUN_CEILING_USD}"
          test "${AWS_REGION}" = "${{ steps.target.outputs.aws_region }}"
          mkdir -p "${EVIDENCE_DIR}" "${CONTROL_DIR}"
          date +%s > "${EVIDENCE_DIR}/workflow-started-epoch.txt"
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "${account}" = "${{ steps.target.outputs.aws_account_id }}"
          aws sts get-caller-identity > "${EVIDENCE_DIR}/caller-identity.json"
          python scripts/capture_account_plan.py \
            "${EVIDENCE_DIR}/account-plan.json" "${account}"
          python scripts/verify_account_plan.py \
            "${EVIDENCE_DIR}/account-plan.json" \
            "${EVIDENCE_DIR}/account-plan-verification.json" \
            "${BUDGET_CEILING_USD}" \
            evidence/aws/organization-shared-credit-baseline.json
          aws budgets describe-budget \
            --account-id "${account}" \
            --budget-name "${BUDGET_NAME}" \
            > "${CONTROL_DIR}/budget-before.json"
          aws budgets describe-notifications-for-budget \
            --account-id "${account}" \
            --budget-name "${BUDGET_NAME}" \
            > "${CONTROL_DIR}/budget-notifications-before.json"
          python scripts/verify_budget.py \
            "${CONTROL_DIR}/budget-before.json" \
            "${CONTROL_DIR}/budget-notifications-before.json" \
            "${EVIDENCE_DIR}/budget-before-verification.json" \
            "${BUDGET_CEILING_USD}"

      - name: Prove live IAM parity before mutation
        run: |
          set -euo pipefail
          aws iam get-role --role-name "${OIDC_ROLE_NAME}" > "${CONTROL_DIR}/role.json"
          aws iam list-role-policies --role-name "${OIDC_ROLE_NAME}" \
            > "${CONTROL_DIR}/inline-policy-names.json"
          aws iam list-attached-role-policies --role-name "${OIDC_ROLE_NAME}" \
            > "${CONTROL_DIR}/attached-policies.json"
          aws iam get-role-policy \
            --role-name "${OIDC_ROLE_NAME}" \
            --policy-name "${POLICY_NAME}" \
            > "${CONTROL_DIR}/live-role-policy.json"
          python scripts/verify_iam_parity.py \
            infra/iam/atlasretail-github-role-policy.json \
            infra/iam/atlasretail-github-role-trust-policy.json \
            "${CONTROL_DIR}/role.json" \
            "${CONTROL_DIR}/inline-policy-names.json" \
            "${CONTROL_DIR}/attached-policies.json" \
            "${CONTROL_DIR}/live-role-policy.json" \
            "${EVIDENCE_DIR}/iam-parity.json"

      - name: Acquire the account-wide lease
        run: |
          bash scripts/acquire_lock.sh
          printf '%s' "${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}" \
            > "${CONTROL_DIR}/lease-owner.txt"

      - name: Persist lease ownership
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-deployment-lease-${{ github.run_id }}
          path: .control/deployment/${{ github.run_id }}/lease-owner.txt
          if-no-files-found: error
          retention-days: 1

      - name: Initialize backend and prove a clean preflight
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="key=${TERRAFORM_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TERRAFORM_LOCK_TABLE}" \
            -backend-config="encrypt=true" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-init.log"
          python scripts/verify_preflight.py \
            "${TF_DIR}" "${EVIDENCE_DIR}/preflight-before.json" \
            "${ACCOUNT_LEASE_TABLE}" \
            "${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}"
          printf '%s' "${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}" \
            > "${CONTROL_DIR}/teardown-authorized.txt"
          python scripts/build_teardown_authority.py \
            --output "${CONTROL_DIR}/teardown-authority.json"

      - name: Persist immutable teardown authority before deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-deployment-authority-${{ github.run_id }}
          path: |
            .control/deployment/${{ github.run_id }}/teardown-authorized.txt
            .control/deployment/${{ github.run_id }}/teardown-authority.json
          if-no-files-found: error
          retention-days: 1

      - name: Create and validate the exact saved apply plan
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" plan \
            -lock-timeout=60s \
            -out="${GITHUB_WORKSPACE}/${CONTROL_DIR}/apply.tfplan" \
            -var="aws_region=${AWS_REGION}" \
            -var="run_id=${RUN_ID}" \
            -var="source_commit=${GITHUB_SHA}" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-apply-plan.log"
          terraform -chdir="${TF_DIR}" show -json \
            "${GITHUB_WORKSPACE}/${CONTROL_DIR}/apply.tfplan" \
            > "${GITHUB_WORKSPACE}/${CONTROL_DIR}/terraform-apply-plan.json"
          terraform -chdir="${TF_DIR}" show -no-color \
            "${GITHUB_WORKSPACE}/${CONTROL_DIR}/apply.tfplan" \
            > "${GITHUB_WORKSPACE}/${CONTROL_DIR}/terraform-apply-plan.txt"
          python scripts/validate_terraform_plan.py \
            --mode apply \
            --exact-envelope \
            --plan "${CONTROL_DIR}/terraform-apply-plan.json" \
            --output "${EVIDENCE_DIR}/terraform-apply-plan-validation.json"
          python scripts/summarize_terraform_plan.py \
            "${CONTROL_DIR}/terraform-apply-plan.json" \
            "${EVIDENCE_DIR}/terraform-apply-plan-inventory.json"
          python - "${EVIDENCE_DIR}/terraform-apply-plan-validation.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["result"] == "PASS", value
          assert value["resource_count"] == 40, value
          assert value["read_only_data_source_counts"] == {"aws_iam_policy_document": 6}, value
          PY
          python scripts/extract_state_machine_definition.py \
            "${CONTROL_DIR}/terraform-apply-plan.json" \
            "${CONTROL_DIR}/state-machine-definition.json"
          aws stepfunctions validate-state-machine-definition \
            --definition "file://${CONTROL_DIR}/state-machine-definition.json" \
            --type STANDARD \
            --severity WARNING \
            > "${EVIDENCE_DIR}/state-machine-validation.json"
          python - "${EVIDENCE_DIR}/state-machine-validation.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value.get("result") == "OK", value
          PY
          sha256sum \
            "${CONTROL_DIR}/apply.tfplan" \
            "${CONTROL_DIR}/terraform-apply-plan.json" \
            "${CONTROL_DIR}/terraform-apply-plan.txt" \
            > "${EVIDENCE_DIR}/terraform-apply-plan-hashes.txt"

      - name: Apply only the validated saved plan
        run: |
          set -euo pipefail
          date +%s > "${EVIDENCE_DIR}/terraform-apply-started-epoch.txt"
          terraform -chdir="${TF_DIR}" apply -auto-approve \
            "${GITHUB_WORKSPACE}/${CONTROL_DIR}/apply.tfplan" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-apply.log"
          date +%s > "${EVIDENCE_DIR}/terraform-apply-completed-epoch.txt"
          terraform -chdir="${TF_DIR}" output -json \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-outputs.json"

      - name: Verify deployed control plane and zero workload
        run: |
          set -euo pipefail
          python scripts/verify_deployment.py \
            "${EVIDENCE_DIR}/terraform-outputs.json" \
            "${TF_DIR}" \
            "${RUN_ID}" \
            "${GITHUB_SHA}" \
            "${EVIDENCE_DIR}/deployment-verification.json"

      - name: Capture post-deployment budget evidence
        if: ${{ always() && steps.aws-credentials.outcome == 'success' }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          aws budgets describe-budget \
            --account-id "${account}" \
            --budget-name "${BUDGET_NAME}" \
            > "${CONTROL_DIR}/budget-after-deployment.json"
          aws budgets describe-notifications-for-budget \
            --account-id "${account}" \
            --budget-name "${BUDGET_NAME}" \
            > "${CONTROL_DIR}/budget-notifications-after-deployment.json"
          python scripts/verify_budget.py \
            "${CONTROL_DIR}/budget-after-deployment.json" \
            "${CONTROL_DIR}/budget-notifications-after-deployment.json" \
            "${EVIDENCE_DIR}/budget-after-deployment-verification.json" \
            "${BUDGET_CEILING_USD}"
          date +%s > "${EVIDENCE_DIR}/deployment-evidence-collected-epoch.txt"

      - name: Persist teardown recovery evidence before teardown
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-deployment-pre-teardown-${{ github.run_id }}
          path: evidence/deployment/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1

  teardown:
    needs: [admission, deploy]
    if: ${{ always() && needs.admission.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      RUN_ID: ${{ github.run_id }}
      TF_DIR: infra/atlas
      EVIDENCE_DIR: evidence/deployment/${{ github.run_id }}
      CONTROL_DIR: .control/deployment/${{ github.run_id }}
      BUDGET_CEILING_USD: ${{ inputs.budget_ceiling_usd }}
      DEPLOY_JOB_RESULT: ${{ needs.deploy.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Load and verify the checked-in AWS target
        id: target
        run: |
          python scripts/load_aws_target.py \
            --github-output "${GITHUB_OUTPUT}" \
            --github-env "${GITHUB_ENV}" \
            --expect-role-arn "${{ vars.AWS_ROLE_ARN }}" \
            --expect-region "${{ vars.AWS_REGION }}" \
            --expect-repository "${GITHUB_REPOSITORY}" \
            --expect-ref "${GITHUB_REF}" \
            --source-identity "${EVIDENCE_DIR}/teardown-source-identity.json" \
            --source-commit "${GITHUB_SHA}" \
            --github-run-id "${GITHUB_RUN_ID}"
      - name: Render the teardown session boundary
        id: session-policy
        run: |
          policy="$(python scripts/build_phase5_session_policy.py \
            --mode teardown --output "${EVIDENCE_DIR}/teardown-session-policy.json")"
          printf 'json=%s\n' "${policy}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        id: aws-credentials
        with:
          role-to-assume: ${{ steps.target.outputs.oidc_role_arn }}
          aws-region: ${{ steps.target.outputs.aws_region }}
          role-session-name: atlasretail-deploy-teardown-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ steps.target.outputs.aws_account_id }}
          inline-session-policy: ${{ steps.session-policy.outputs.json }}
          unset-current-credentials: true
          mask-aws-account-id: true
          action-timeout-s: 120

      - name: Prepare teardown workspace
        run: mkdir -p "${EVIDENCE_DIR}" "${CONTROL_DIR}"

      - name: Recover deployment evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlasretail-deployment-pre-teardown-${{ github.run_id }}
          path: evidence/deployment/${{ github.run_id }}

      - name: Recover immutable teardown authority
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlasretail-deployment-authority-${{ github.run_id }}
          path: .control/deployment/${{ github.run_id }}

      - name: Validate teardown authority
        id: authority
        run: |
          set -euo pipefail
          expected="${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}"
          marker="${CONTROL_DIR}/teardown-authorized.txt"
          manifest="${CONTROL_DIR}/teardown-authority.json"
          if [[ -s "${marker}" ]] && [[ "$(<"${marker}")" = "${expected}" ]] && [[ -s "${manifest}" ]]; then
            python scripts/validate_teardown_authority.py \
              --manifest "${manifest}" \
              --output "${EVIDENCE_DIR}/teardown-authority-verification.json" \
              --repository "${GITHUB_REPOSITORY}" \
              --run-id "${GITHUB_RUN_ID}" \
              --source-commit "${GITHUB_SHA}" \
              --account "${AWS_ACCOUNT_ID}" \
              --region "${AWS_REGION}" \
              --backend-bucket "${TERRAFORM_STATE_BUCKET}" \
              --backend-key "${TERRAFORM_STATE_KEY}"
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            printf '{"result":"FAIL","reason":"Valid teardown authority is unavailable."}\n' \
              > "${EVIDENCE_DIR}/teardown.json"
            printf '{"result":"FAIL","reason":"Valid teardown authority is unavailable."}\n' \
              > "${EVIDENCE_DIR}/teardown-authority-verification.json"
          fi

      - name: Initialize backend and recover outputs
        if: steps.authority.outputs.present == 'true'
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="key=${TERRAFORM_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TERRAFORM_LOCK_TABLE}" \
            -backend-config="encrypt=true" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-teardown-init.log"
          outputs="${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/terraform-outputs.json"
          if [[ ! -s "${outputs}" ]]; then
            terraform -chdir="${TF_DIR}" output -json > "${outputs}" \
              2> "${EVIDENCE_DIR}/terraform-output-recovery.log" \
              || printf '{}\n' > "${outputs}"
          fi

      - name: Create and validate the saved destroy-only plan
        if: steps.authority.outputs.present == 'true'
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" plan -destroy \
            -lock-timeout=60s \
            -out="${GITHUB_WORKSPACE}/${CONTROL_DIR}/destroy.tfplan" \
            -var="aws_region=${AWS_REGION}" \
            -var="run_id=${RUN_ID}" \
            -var="source_commit=${GITHUB_SHA}" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-destroy-plan.log"
          terraform -chdir="${TF_DIR}" show -json \
            "${GITHUB_WORKSPACE}/${CONTROL_DIR}/destroy.tfplan" \
            > "${GITHUB_WORKSPACE}/${CONTROL_DIR}/terraform-destroy-plan.json"
          terraform -chdir="${TF_DIR}" show -no-color \
            "${GITHUB_WORKSPACE}/${CONTROL_DIR}/destroy.tfplan" \
            > "${GITHUB_WORKSPACE}/${CONTROL_DIR}/terraform-destroy-plan.txt"
          envelope=(--allow-partial-destroy)
          if [[ "${DEPLOY_JOB_RESULT}" = "success" ]]; then
            envelope=(--exact-envelope)
          fi
          python scripts/validate_terraform_plan.py \
            --mode destroy \
            "${envelope[@]}" \
            --plan "${CONTROL_DIR}/terraform-destroy-plan.json" \
            --output "${EVIDENCE_DIR}/terraform-destroy-plan-validation.json"
          sha256sum \
            "${CONTROL_DIR}/destroy.tfplan" \
            "${CONTROL_DIR}/terraform-destroy-plan.json" \
            "${CONTROL_DIR}/terraform-destroy-plan.txt" \
            > "${EVIDENCE_DIR}/terraform-destroy-plan-hashes.txt"

      - name: Apply only the validated saved destroy plan
        if: steps.authority.outputs.present == 'true'
        run: |
          set -euo pipefail
          date +%s > "${EVIDENCE_DIR}/terraform-destroy-started-epoch.txt"
          terraform -chdir="${TF_DIR}" apply -auto-approve \
            "${GITHUB_WORKSPACE}/${CONTROL_DIR}/destroy.tfplan" \
            2>&1 | tee "${EVIDENCE_DIR}/terraform-destroy.log"
          date +%s > "${EVIDENCE_DIR}/terraform-destroy-completed-epoch.txt"

      - name: Prove teardown across AWS and Terraform inventories
        id: verify_teardown
        if: ${{ always() && steps.authority.outputs.present == 'true' }}
        run: |
          python scripts/verify_teardown.py \
            "${EVIDENCE_DIR}/terraform-outputs.json" \
            "${TF_DIR}" \
            "${RUN_ID}" \
            "${EVIDENCE_DIR}/teardown.json"

      - name: Capture post-teardown budget evidence
        if: ${{ always() && steps.aws-credentials.outcome == 'success' }}
        continue-on-error: true
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          aws budgets describe-budget \
            --account-id "${account}" \
            --budget-name "${BUDGET_NAME}" \
            > "${CONTROL_DIR}/budget-after-teardown.json"
          aws budgets describe-notifications-for-budget \
            --account-id "${account}" \
            --budget-name "${BUDGET_NAME}" \
            > "${CONTROL_DIR}/budget-notifications-after-teardown.json"
          python scripts/verify_budget.py \
            "${CONTROL_DIR}/budget-after-teardown.json" \
            "${CONTROL_DIR}/budget-notifications-after-teardown.json" \
            "${EVIDENCE_DIR}/budget-after-teardown-verification.json" \
            "${BUDGET_CEILING_USD}"

      - name: Release only a clean run's account-wide lease
        if: ${{ always() && steps.verify_teardown.outcome == 'success' }}
        env:
          PORTFOLIO_LOCK_OWNER: ${{ github.repository }}/${{ github.run_id }}
        run: bash scripts/release_lock.sh

      - name: Remove ephemeral teardown inputs from final evidence
        if: always()
        run: |
          python - "${EVIDENCE_DIR}/terraform-outputs.json" <<'PY'
          import pathlib, sys

          pathlib.Path(sys.argv[1]).unlink(missing_ok=True)
          PY

      - name: Build final Part 3 evidence summary
        if: always()
        run: |
          python scripts/summarize_deployment_evidence.py \
            "${EVIDENCE_DIR}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}"

      - name: Upload final controlled-deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasretail-controlled-deployment-${{ github.run_id }}
          path: evidence/deployment/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
