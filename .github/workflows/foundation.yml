name: Shared AWS foundation

on:
  workflow_dispatch:
    inputs:
      monthly_budget_usd:
        description: Monthly gross-cost guardrail in USD
        required: true
        default: "20"

permissions:
  id-token: write
  contents: read

concurrency:
  group: portfolio-aws-account
  cancel-in-progress: false

jobs:
  deploy-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Load and verify the checked-in AWS target
        id: target
        run: |
          python scripts/load_aws_target.py \
            --github-output "${GITHUB_OUTPUT}" \
            --github-env "${GITHUB_ENV}" \
            --expect-role-arn "${{ vars.AWS_ROLE_ARN }}" \
            --expect-region "${{ vars.AWS_REGION }}" \
            --expect-repository "${GITHUB_REPOSITORY}" \
            --expect-ref "${GITHUB_REF}"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ steps.target.outputs.oidc_role_arn }}
          aws-region: ${{ steps.target.outputs.aws_region }}
      - name: Prove identity
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "${account}" = "${AWS_ACCOUNT_ID}"
          test "${AWS_REGION}" = "${{ steps.target.outputs.aws_region }}"
      - name: Validate and deploy
        env:
          BUDGET_USD: ${{ inputs.monthly_budget_usd }}
        run: |
          set -euo pipefail
          test "${BUDGET_USD}" -ge 1
          test "${BUDGET_USD}" = "${MONTHLY_BUDGET_USD}"
          mkdir -p evidence/foundation
          aws cloudformation validate-template \
            --template-body file://infra/foundation/template.yml \
            > evidence/foundation/validate-template.json
          aws cloudformation deploy \
            --stack-name portfolio-lab-foundation \
            --template-file infra/foundation/template.yml \
            --parameter-overrides MonthlyBudgetUsd="${BUDGET_USD}" \
            --no-fail-on-empty-changeset \
            2>&1 | tee evidence/foundation/deploy.log
      - name: Record outputs
        run: |
          set -euo pipefail
          mkdir -p evidence/foundation
          aws cloudformation describe-stacks \
            --stack-name portfolio-lab-foundation \
            --query 'Stacks[0].{StackId:StackId,Status:StackStatus,Outputs:Outputs}' \
            > evidence/foundation/stack.json
          aws dynamodb describe-time-to-live \
            --table-name "${ACCOUNT_LEASE_TABLE}" \
            > evidence/foundation/lease-ttl.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foundation-evidence-${{ github.run_id }}
          path: evidence/foundation
          if-no-files-found: error
          retention-days: 14
