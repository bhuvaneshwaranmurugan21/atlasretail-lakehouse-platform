[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasretail-lakehouse-platform"
version = "0.1.0"
description = "Retail lakehouse correctness kernel and bounded AWS execution lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bhuvaneshwaran Murugan" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "cfn-lint==1.55.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.8"
]

[project.scripts]
atlasretail = "atlasretail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["atlasretail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=atlasretail --cov-report=term-missing --cov-fail-under=85"
